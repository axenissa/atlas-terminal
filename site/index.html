<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Atlas Terminal</title>
  <meta name="description" content="Mini financial terminal built only on free public data: Yahoo Finance, SEC EDGAR, FRED, Google News, FinBERT, CB-Monitor.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ctext x='3' y='13' font-size='13' font-family='monospace' fill='%23ffb000'%3EA%3C/text%3E%3C/svg%3E">
  <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">ATLAS TERMINAL</div>
    <div class="cmd">
      <label for="cmd">&gt;</label>
      <input id="cmd" autocomplete="off" spellcheck="false" placeholder="Ticker or command: AAPL, AAPL FA, EURUSD, gold, ECO, CBM, HELP">
      <button id="go" class="go">GO</button>
      <div id="suggest" class="suggest"></div>
    </div>
    <div class="clock" id="clock"></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>
  <footer id="footer"></footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
